name: Sync funding brief

# Retired 2026-11-03. The funding page is now published from the private
# knowledge base (aquastar/zhiqian-knowledge-base, publish-funding.yml) after
# the weekly cloud routine writes radars/funding/. The old Drive brief is no
# longer updated, and this schedule overwrote the 2026-11-02 brief with the
# stale 2026-10-26 one. Kept for a manual run only.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: funding-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download from Google Drive
        env:
          BRIEF_ID: 1et39rEJJ70voUUF7ud2RYhXTwZX7ogenrGvKdwve540
          REGISTRY_ID: 1-OKjccnRGEzTQUtGdGYQ8s-4fyIiS6en7IXhUqs_XCo
          WATCHLIST_ID: 1PGB9PbWlaleLpyaIrLElkH_mHK0fMCvo-soowbUSoC0
        run: |
          set -euo pipefail
          curl -fsSL "https://docs.google.com/document/d/$BRIEF_ID/export?format=txt" -o brief.txt
          curl -fsSL "https://docs.google.com/document/d/$REGISTRY_ID/export?format=txt" -o registry.txt
          curl -fsSL "https://docs.google.com/spreadsheets/d/$WATCHLIST_ID/export?format=csv" -o watchlist.csv

      # The parser lives in the repo rather than inline here, so it can be run
      # and checked locally before a Friday morning does it unattended. It
      # strips every personal field out of the Drive brief and fails the run
      # rather than letting one through. See the header of the script.
      - name: Build the public pages and data
        run: python3 scripts/build-funding.py brief.txt registry.txt watchlist.csv

      - name: Commit and push
        run: |
          rm -f brief.txt registry.txt watchlist.csv
          git config user.name "aquastar"
          git config user.email "2832070+aquastar@users.noreply.github.com"
          # src/data/funding.json is what the page imports. Leaving it out
          # of the commit published new files every week while the rendered
          # page kept whatever data was last committed by hand: on
          # 2026-10-16 the published registry held 172 rows and the page
          # still showed 134.
          git add src/pages/funding public/funding src/data/funding.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Funding brief $(date -u +%F)"
            git push
          fi
