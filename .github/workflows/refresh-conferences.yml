name: Refresh conference data

# The upstream sources move on their own. ccf-deadlines gains editions, CORE
# revises ranks, and acceptance rates get filled in, so a page built once
# quietly goes stale. Rebuild weekly and only commit when something changed.
#
# Daily, because deadlines are the point of the page and a rebuild costs
# under a minute and no API credits; a day with no upstream change commits
# nothing. The slower checks run on Mondays only: asking every venue's own
# site whether ccf-deadlines is right, and the audit of hand-kept dates.
# Topics and papers are in refresh-topics.yml.
on:
  schedule:
    - cron: '17 6 * * *'   # every day, 06:17 UTC
  workflow_dispatch:        # and on demand from the Actions tab

permissions:
  contents: write
  issues: write     # the weekly deadline check is posted as an issue

# Both data workflows push to main; never let them run at once.
concurrency: site-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet pyyaml

      # Monday, or a run started by hand, gets the weekly checks too.
      - name: Is this the weekly run?
        id: day
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "weekly=true" >> "$GITHUB_OUTPUT"
          else
            echo "weekly=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild src/data/conferences.js
        run: python3 scripts/build-conferences.py

      # Reuses the ccf-deadlines clone that build-conferences.py just pulled.
      # A city it has never seen is looked up on OpenStreetMap's Nominatim
      # (one a second, cached in scripts/geocode-cache.json), so most days
      # this makes no requests at all.
      - name: Rebuild src/data/destinations.js
        run: python3 scripts/build-destinations.py

      # Reports, never rewrites. The deadlines come from ccfddl; this asks
      # each venue's own site whether ccfddl is still right, and prints the
      # disagreements. It is allowed to fail without failing the refresh,
      # because a venue site being down is not a reason to skip a data
      # update. Read it in the job log: a disagreement means someone should
      # check the venue and, if confirmed, add it to DEADLINE_FIX.
      - name: Check deadlines against the venues' own sites
        if: steps.day.outputs.weekly == 'true'
        continue-on-error: true
        run: python3 scripts/check-deadlines.py

      # The hand-kept deadlines are the ones nothing upstream maintains. List
      # the ones due soon and the estimates that have probably gone stale, in
      # the job summary and in one standing issue that is edited each week,
      # so a stale date reaches an inbox instead of waiting to be noticed.
      - name: Audit the hand-kept deadlines
        if: steps.day.outputs.weekly == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/audit-deadlines.py > audit.md
          cat audit.md >> "$GITHUB_STEP_SUMMARY"
          gh label create deadline-check --color FBCA04 --description "Weekly deadline audit" --force
          num=$(gh issue list --label deadline-check --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue edit "$num" --title "Deadline check, $(date -u +%F)" --body-file audit.md
          else
            gh issue create --title "Deadline check, $(date -u +%F)" --label deadline-check --body-file audit.md
          fi
          rm audit.md

      - name: Commit if the data moved
        run: |
          git add src/data/conferences.js src/data/destinations.js scripts/journal-cache.json scripts/geocode-cache.json
          if git diff --cached --quiet; then
            echo "No upstream change today."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Conferences: daily data refresh

          Rebuilt from ccf-deadlines, the official CORE2023 export,
          cs-conf-stats, CSRankings, the older acceptance-rate table,
          OpenAlex and the CCF journal list for the journals, and the
          destination index."
          git pull --rebase
          git push
