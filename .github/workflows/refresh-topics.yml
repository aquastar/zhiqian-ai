name: Refresh topics and papers

# The slow-moving half of the conference page: the per-topic acceptance
# rates at ICLR, and for every field the twenty most published keywords
# with ten representative papers each. Deadlines are in
# refresh-conferences.yml.
#
# Spread over the month rather than done in one go. This runs daily and
# rebuilds at most one field, the stalest past four weeks old, so the 23
# fields settle into a rotation of one a day and each is refreshed about
# monthly. Keep the field count under 28 or raise the cap. A field costs
# about thirty OpenAlex credits, so a day costs about thirty, well inside the free
# 1,000 a day that every user on the runner's IP shares. Most days nothing
# is stale and the run ends without a commit. The ICLR file, a few tens of
# MB from GitHub raw and no credits, is rebuilt on the 1st.
# Set an OPENALEX_API_KEY repository secret to use a key's own budget.
on:
  schedule:
    - cron: '41 7 * * *'   # every day, 07:41 UTC
  workflow_dispatch:
    inputs:
      fields:
        description: 'Fields to rebuild this run (0 for every stale field)'
        default: '1'
      force:
        description: 'Rebuild even fields refreshed in the last four weeks'
        type: boolean
        default: false

permissions:
  contents: write

concurrency: site-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild src/data/topics.js (ICLR per-topic acceptance), on the 1st
        run: |
          if [ "$(date -u +%d)" = "01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/build-topics.py
          else
            echo "Not the 1st; ICLR topics wait."
          fi

      # Reads the journal list from the committed src/data/conferences.js.
      - name: Rebuild the stalest fields in src/data/trends.js and public/trend-papers/
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          TRENDS_MAX_FIELDS: ${{ inputs.fields || '1' }}
          TRENDS_FORCE: ${{ inputs.force && '1' || '' }}
        run: python3 scripts/build-trends.py

      - name: Commit if the data moved
        run: |
          git add src/data/topics.js src/data/trends.js public/trend-papers
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Conferences: topics and papers refresh

          Most published keywords and representative papers for the
          stalest fields, from OpenAlex; ICLR per-topic acceptance on the
          1st of the month."
          git pull --rebase
          git push
