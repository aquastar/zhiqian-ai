name: Refresh conference data

# The upstream sources move on their own — ccf-deadlines gains editions, CORE
# revises ranks, acceptance rates get filled in — so a page built once quietly
# goes stale. Rebuild weekly and only commit when something actually changed.
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC
  workflow_dispatch:        # and on demand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet pyyaml

      - name: Rebuild src/data/conferences.js
        run: python3 scripts/build-conferences.py

      - name: Commit if the data moved
        run: |
          if git diff --quiet -- src/data/conferences.js; then
            echo "No upstream change this week."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/conferences.js
          git commit -m "Conferences: weekly data refresh

          Rebuilt from ccf-deadlines, the official CORE2023 export and the
          acceptance-rate table.

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
          git push
